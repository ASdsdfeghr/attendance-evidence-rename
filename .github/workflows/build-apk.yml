name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare School Logo and Club App Icon
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          for f in images.png *.png; do
            if [ -f "$f" ]; then
              cp "$f" app/src/main/assets/school_logo.png
              cp "$f" app/src/main/res/drawable/school_logo.png
              break
            fi
          done
          FOUND_ICON=0
          for f in FB_IMG*.jpg *.jpg *.jpeg; do
            if [ -f "$f" ]; then
              cp "$f" app/src/main/res/drawable/club_icon.jpg
              cp "$f" app/src/main/assets/club_icon.jpg
              FOUND_ICON=1
              break
            fi
          done
          if [ $FOUND_ICON -eq 0 ]; then
            cat << 'EOF' > app/src/main/res/drawable/club_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F5F0EE" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0D0D0D" android:pathData="M54,10 L98,54 L54,98 L10,54 Z"/>
              <path android:fillColor="#E03C11" android:pathData="M30,46 L78,46 L78,62 L30,62 Z"/>
          </vector>
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: NQD-Volley-Attendance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
